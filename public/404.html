<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found · Pranit Acharju Newar</title>
    <meta name="robots" content="noindex" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #fafafa;
        color: #4d4d4d;
        font-family: Inter, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        text-align: center;
      }
      .code {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: #0070f3;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 52px;
        letter-spacing: -2px;
        color: #171717;
        margin: 16px 0 12px;
      }
      p {
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        height: 42px;
        border-radius: 100px;
        background: #171717;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">Error 404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a href="/portfolio/">Back to portfolio</a>
    </div>
  </body>
</html>
